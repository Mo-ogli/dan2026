<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Agulhas Negras 2026 - Classificação Parcial</title>
    <style>
        :root {
            --primary: #8fa671;
            --accent: #d9b340;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --text-light: #ffffff;
            --text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #3b4d36;
            color: var(--text-light);
            overflow: hidden;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(41, 56, 38, 0.7);
            z-index: -1;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .logos-container {
            position: absolute;
            top: 30px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }
        
        #textoResultado {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 15px;
            text-align: center;
            width: 100%;
            font-size: 2.5em;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .logo-img, .logo-evento {
            max-width: 210px;
            max-height: 210px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .logo-evento {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            background-color: transparent;
        }

        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 50px;
            width: 85%;
            height: 60%;
            margin-top: 50px;
        }

        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-shadow: var(--text-shadow);
        }

        .place-2, .place-3 {
            margin-bottom: 20px;
        }

        .place-1 {
            margin-bottom: 90px;
            transform: scale(1.15);
        }

        .medal {
            font-size: 3.5em;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.6));
        }

        .emblem-box {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.6));
        }

        .emblem-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .place-title {
            font-size: 1.4em;
            font-weight: 800;
            color: var(--silver);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .place-1 .place-title { color: var(--accent); font-size: 1.6em;}
        .place-3 .place-title { color: var(--bronze); }

        .team-name {
            font-size: 1.6em;
            font-weight: 800;
            text-transform: uppercase;
            margin: 5px 0 0 0;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .team-country {
            font-size: 1.1em;
            font-weight: 600;
            color: #d1d1d1;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .team-score {
            font-size: 1.4em;
            font-weight: 600;
            margin-top: 5px;
        }

        #status-msg {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: rgba(255,255,255,0.6);
        }

        @media (max-width: 900px) {
            body, html {
                overflow-y: auto;
            }

            .content-wrapper {
                justify-content: flex-start;
                padding-top: 20px;
                padding-bottom: 60px;
                height: auto;
                min-height: 100vh;
            }

            .logos-container {
                position: relative;
                top: 0;
                width: 95%;
                margin-bottom: 20px;
                align-items: center;
            }

            .logo-img, .logo-evento {
                max-width: 80px;
                max-height: 80px;
            }

            #textoResultado {
                position: static;
                transform: none;
                font-size: 1.5em;
                margin-top: 10px;
                line-height: 1.2;
            }

            .podium-container {
                flex-direction: column;
                align-items: center;
                height: auto;
                gap: 40px;
                margin-top: 20px;
                width: 100%;
            }

            .place-1, .place-2, .place-3 {
                margin-bottom: 0;
                transform: none;
                width: 90%;
            }

            .place-1 { order: 1; transform: scale(1.05); }
            .place-2 { order: 2; }
            .place-3 { order: 3; }

            .emblem-box {
                width: 130px;
                height: 130px;
            }

            .medal {
                font-size: 3em;
            }

            #status-msg {
                position: relative;
                bottom: 0;
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="background-container" id="bg-container"></div>
    <div class="overlay"></div>

    <div class="content-wrapper">
        <div class="logos-container">
            <img id="logoAmanTop" src="" alt="Logo AMAN" class="logo-img" style="display:none;">
            <div id="textoResultado"></div>
            <!-- Logo do Evento -->
            <img id="logoEventoTop" src="" alt="Logo Desafio Agulhas Negras" class="logo-evento" style="display:none;">
        </div>

        <div class="podium-container">
            <div class="podium-place place-2" id="place2">
                <div class="medal">🥈</div>
                <div class="emblem-box">
                    <img id="emblem2" src="" alt="Brasão 2º Lugar" style="display:none;">
                </div>
                <div class="place-title">2º LUGAR</div>
                <div class="team-name" id="name2">Aguardando...</div>
                <div class="team-country" id="country2"></div>
                <div class="team-score" id="score2">-</div>
            </div>

            <div class="podium-place place-1" id="place1">
                <div class="medal">🥇</div>
                <div class="emblem-box">
                    <img id="emblem1" src="" alt="Brasão 1º Lugar" style="display:none;">
                </div>
                <div class="place-title">1º LUGAR</div>
                <div class="team-name" id="name1">Aguardando...</div>
                <div class="team-country" id="country1"></div>
                <div class="team-score" id="score1">-</div>
            </div>

            <div class="podium-place place-3" id="place3">
                <div class="medal">🥉</div>
                <div class="emblem-box">
                    <img id="emblem3" src="" alt="Brasão 3º Lugar" style="display:none;">
                </div>
                <div class="place-title">3º LUGAR</div>
                <div class="team-name" id="name3">Aguardando...</div>
                <div class="team-country" id="country3"></div>
                <div class="team-score" id="score3">-</div>
            </div>
        </div>

        <div id="status-msg">Conectando aos servidores blindados...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadSiteData);

        const linkPlanilha = 'https://docs.google.com/spreadsheets/d/1kLUvtuDB3ed9S8WWRAhB0zeRagAGjObUts5-f2tbFic/edit?usp=sharing';
        
        let emblemasMap = {};
        let paisesMap = {}; 

        function fetchSheetRaw(sheetId, sheetName, gid, callbackName) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                const cacheBuster = new Date().getTime();
                
                window[callbackName] = function(json) {
                    if (json && json.status !== 'error') {
                        resolve(json.table);
                    } else {
                        resolve(null);
                    }
                    delete window[callbackName];
                    script.remove();
                };

                script.onerror = function() { 
                    resolve(null); 
                    delete window[callbackName];
                    script.remove();
                };

                let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&headers=1&_=${cacheBuster}`;
                if (sheetName) {
                    url += `&sheet=${encodeURIComponent(sheetName)}`;
                } else if (gid) {
                    url += `&gid=${gid}`;
                }
                
                script.src = url;
                document.body.appendChild(script);
            });
        }

        function loadSiteData() {
            const match = linkPlanilha.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (!match) {
                document.getElementById('status-msg').innerText = "Erro: Link da planilha inválido.";
                return;
            }
            const sheetId = match[1];

            Promise.all([
                fetchSheetRaw(sheetId, 'Site', null, 'cbSite')
                    .then(dt => dt ? dt : fetchSheetRaw(sheetId, 'Site ', null, 'cbSite2')),
                fetchSheetRaw(sheetId, 'Emblemas', null, 'cbEmblemas')
                    .then(dt => dt ? dt : fetchSheetRaw(sheetId, 'Emblemas ', null, 'cbEmblemas2')),
                fetchSheetRaw(sheetId, 'Texto', null, 'cbTexto')
                    .then(dt => dt ? dt : fetchSheetRaw(sheetId, 'Texto ', null, 'cbTexto2'))
            ]).then(([dtSite, dtEmblemas, dtTexto]) => {
                
                if (dtEmblemas) {
                    processEmblemas(dtEmblemas);
                }
                
                if (dtTexto) {
                    processTexto(dtTexto);
                }

                if (!dtSite) {
                    document.getElementById('status-msg').innerHTML = '🔴 <b>Acesso Negado ou Aba "Site" não encontrada!</b>';
                } else {
                    const agora = new Date();
                    document.getElementById('status-msg').innerHTML = '🟢 Sincronizado | Última atualização: ' + agora.toLocaleTimeString('pt-BR');
                    processSitePodium(dtSite);
                }
                
                setTimeout(loadSiteData, 30000);
            });
        }

        function getStringRaw(dt, i, col) {
            if (!dt.rows[i] || !dt.rows[i].c || col >= dt.cols.length) return '';
            const celula = dt.rows[i].c[col];
            if (!celula || celula.v === null || celula.v === undefined) return '';
            return celula.v.toString().trim();
        }

        function obterValorRaw(dt, i, col) {
            if (!dt.rows[i] || !dt.rows[i].c || col >= dt.cols.length) return 0;
            const celula = dt.rows[i].c[col];
            if (!celula || celula.v === null || celula.v === undefined) return 0;
            const parsed = parseFloat(celula.v);
            return isNaN(parsed) ? 0 : parsed;
        }

        function processEmblemas(dt) {
            emblemasMap = {};
            paisesMap = {};
            const rows = dt.rows.length;
            for (let i = 0; i < rows; i++) {
                let equipe = getStringRaw(dt, i, 0);
                let link = getStringRaw(dt, i, 1);
                let pais = getStringRaw(dt, i, 2);
                
                if (equipe) {
                    equipe = equipe.trim();
                    if (link) emblemasMap[equipe] = link.trim();
                    if (pais) paisesMap[equipe] = pais.trim();
                }
            }

            let keyFundo = Object.keys(emblemasMap).find(k => k.toLowerCase().includes('fundo'));
            if (keyFundo && emblemasMap[keyFundo]) {
                let urlFundo = emblemasMap[keyFundo].replace(/['"]/g, '').trim(); 
                document.getElementById('bg-container').style.backgroundImage = 'url(' + urlFundo + ')';
            }

            let keyAman = Object.keys(emblemasMap).find(k => k.toUpperCase().includes('AMAN'));
            if (keyAman && emblemasMap[keyAman]) {
                const logoAmanEl = document.getElementById('logoAmanTop');
                logoAmanEl.src = emblemasMap[keyAman];
                logoAmanEl.style.display = 'block';
            }

            // AJUSTE: Procura por qualquer chave que contenha "SYMBOL"
            let keySymbol = Object.keys(emblemasMap).find(k => k.toUpperCase().includes('SYMBOL'));
            if (keySymbol && emblemasMap[keySymbol]) {
                const logoEventoEl = document.getElementById('logoEventoTop');
                logoEventoEl.src = emblemasMap[keySymbol];
                logoEventoEl.style.display = 'block';
            }
        }
        
        function processTexto(dt) {
            if (!dt || !dt.rows || dt.rows.length === 0) return;
            let texto = getStringRaw(dt, 0, 0);
            if (!texto && dt.rows.length > 1) texto = getStringRaw(dt, 1, 0);
            if (texto) {
                document.getElementById('textoResultado').innerText = texto;
            }
        }

        function processSitePodium(dt) {
            const equipes = [];
            const rows = dt.rows.length;

            for (let i = 0; i < rows; i++) {
                const nome = getStringRaw(dt, i, 0);
                if (!nome) continue;
                const total = obterValorRaw(dt, i, 14);
                equipes.push({ nome, total });
            }

            equipes.sort((a, b) => b.total - a.total);

            const getFlag = (nome) => {
                for (let key in emblemasMap) {
                    if (nome.includes(key) && emblemasMap[key]) {
                        return emblemasMap[key];
                    }
                }
                return `https://placehold.co/180x180/8fa671/ffffff?text=${encodeURIComponent(nome)}`;
            };

            const getCountry = (nome) => {
                for (let key in paisesMap) {
                    if (nome.includes(key) && paisesMap[key]) {
                        return paisesMap[key];
                    }
                }
                return ''; 
            };

            const todasZeradas = equipes.every(eq => eq.total === 0);

            const setPodiumCard = (equipe, index) => {
                const nameEl = document.getElementById('name' + index);
                const scoreEl = document.getElementById('score' + index);
                const countryEl = document.getElementById('country' + index);
                const imgEl = document.getElementById('emblem' + index);
                const emblemBoxEl = imgEl.parentElement;

                if (todasZeradas || !equipe) {
                    nameEl.innerHTML = '';
                    scoreEl.innerText = '';
                    countryEl.style.display = 'none';
                    emblemBoxEl.style.display = 'none';
                    return;
                }

                emblemBoxEl.style.display = 'flex';

                let nomeCurto = equipe.nome;
                if (nomeCurto.includes('-')) {
                     let partes = nomeCurto.split('-');
                     nomeCurto = `EQUIPE ${partes[0].trim()}<br><span style="font-size:0.6em">${partes[1].trim()}</span>`;
                } else if (!nomeCurto.toLowerCase().includes('equipe')) {
                     nomeCurto = `EQUIPE ${nomeCurto}`;
                }

                nameEl.innerHTML = nomeCurto;
                scoreEl.innerText = `PONTUAÇÃO: ${equipe.total.toLocaleString('pt-BR')} PONTOS`;
                
                const countryName = getCountry(equipe.nome);
                if (countryName) {
                    countryEl.innerText = countryName;
                    countryEl.style.display = 'block';
                } else {
                    countryEl.style.display = 'none';
                }
                
                imgEl.src = getFlag(equipe.nome);
                imgEl.style.display = 'block';
            };

            setPodiumCard(equipes[0], 1);
            setPodiumCard(equipes[1], 2);
            setPodiumCard(equipes[2], 3);
        }
    </script>
</body>
</html>
